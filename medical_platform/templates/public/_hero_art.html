{# 장식용 일러스트: 벚꽃 가지 + 남산타워 + 서울 스카이라인 (스크린리더에서는 숨김) #}
{% macro blossom(x, y, s=1, fill='#ffd6e2') %}
<g transform="translate({{ x }} {{ y }}) scale({{ s }})">
  {% for a in [0, 72, 144, 216, 288] %}<ellipse cx="0" cy="-9" rx="6.5" ry="10" fill="{{ fill }}" transform="rotate({{ a }})"/>{% endfor %}
  <circle r="3.6" fill="#ff8fab"/>
</g>
{% endmacro %}
<svg class="hero-svg" viewBox="0 0 480 540" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ha-sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffc2d4"/><stop offset=".55" stop-color="#ffd2bd"/><stop offset="1" stop-color="#e6dcff"/>
    </linearGradient>
    <radialGradient id="ha-sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ha-arch"><path d="M40 540V230C40 120 130 40 240 40s200 80 200 190v310z"/></clipPath>
  </defs>
  <path d="M40 540V230C40 120 130 40 240 40s200 80 200 190v310z" fill="url(#ha-sky)"/>
  <g clip-path="url(#ha-arch)">
    <circle cx="300" cy="200" r="120" fill="url(#ha-sun)"/>
    <path d="M40 470c60-40 120-60 200-62s150 22 200 54v78H40z" fill="#fff" opacity=".35"/>
    <!-- Namsan hill + tower -->
    <path d="M150 470c30-46 80-72 130-72s96 26 126 72z" fill="#fff" opacity=".55"/>
    <rect x="276" y="250" width="8" height="160" rx="3" fill="#fff"/>
    <rect x="262" y="296" width="36" height="26" rx="12" fill="#fff"/>
    <rect x="268" y="326" width="24" height="8" rx="4" fill="#fff" opacity=".9"/>
    <rect x="279" y="214" width="2" height="40" fill="#fff"/>
    <circle cx="280" cy="212" r="3" fill="#ff8fab"/>
    <!-- skyline -->
    <g fill="#fff" opacity=".7">
      <rect x="60" y="430" width="34" height="110" rx="4"/><rect x="100" y="400" width="26" height="140" rx="4"/>
      <rect x="132" y="446" width="40" height="94" rx="4"/><rect x="350" y="420" width="30" height="120" rx="4"/>
      <rect x="386" y="444" width="44" height="96" rx="4"/>
    </g>
    <g fill="#fff">
      <rect x="40" y="488" width="400" height="60"/>
    </g>
    <path d="M40 500c80-14 160-14 240-4s120 8 160-2v46H40z" fill="#ffe3ec"/>
  </g>
  <!-- blossom branch -->
  <path d="M0 70c60 10 110 40 150 86s78 66 118 70" fill="none" stroke="#c98a9b" stroke-width="7" stroke-linecap="round"/>
  <path d="M86 98c10-26 30-40 54-46M150 156c-6 22-2 42 12 58" fill="none" stroke="#c98a9b" stroke-width="4" stroke-linecap="round"/>
  {{ blossom(60, 80, 1.1) }}{{ blossom(104, 112, 0.9, '#fff') }}{{ blossom(140, 52, 1) }}{{ blossom(170, 170, 1.15, '#fff') }}
  {{ blossom(210, 200, 0.9) }}{{ blossom(160, 214, 0.8) }}{{ blossom(262, 226, 1, '#fff') }}{{ blossom(22, 64, 0.8, '#fff') }}
  <g fill="#ffb3c7" opacity=".9">
    <ellipse cx="330" cy="120" rx="5" ry="8" transform="rotate(30 330 120)"/>
    <ellipse cx="380" cy="190" rx="4" ry="7" transform="rotate(-20 380 190)"/>
    <ellipse cx="230" cy="300" rx="4" ry="7" transform="rotate(50 230 300)"/>
    <ellipse cx="120" cy="330" rx="5" ry="8" transform="rotate(-40 120 330)"/>
    <ellipse cx="410" cy="300" rx="4" ry="6" transform="rotate(10 410 300)"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff">
    <path d="M420 90l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M360 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".8"/>
  </g>
</svg>
