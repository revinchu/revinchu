<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>통합 문서1 - WIXEL</title>
  <meta name="application-name" content="WIXEL">
  <meta name="theme-color" content="#185b46">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WIXEL">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" type="image/vnd.microsoft.icon">
  <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="app-header">
    <header class="titlebar">
      <div class="tb-left">
          <button id="mobileModeToggle" type="button" class="tb-btn mobile-mode-toggle" data-cmd="mobileWorkMode" title="모바일 작업 모드 · 화면 맞춤" aria-label="모바일 작업 모드 · 화면 맞춤" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 5h4m-3 14h2M2 8v8m20-8v8M1 8h3m-3 8h3m16-8h3m-3 8h3"/></svg></button>
          <button id="mobileTools" type="button" class="tb-btn mobile-tools-toggle" data-cmd="mobileTools" title="모바일 작업 도구 · 전체 메뉴" aria-label="모바일 작업 도구 · 전체 메뉴">☰</button>
        <button class="tb-brand" data-cmd="backstage" title="WIXEL 시작 화면">WIXEL</button>
        <div class="autosave">
          <span>자동 저장</span>
          <button id="autosaveToggle" class="toggle" role="switch" aria-checked="true" title="자동 저장 (브라우저에 보관)"><i></i></button>
          <span id="autosaveLabel" class="toggle-label">켬</span>
        </div>
        <button class="tb-btn" data-cmd="save" title="저장 (Ctrl+S)" data-icon="save"></button>
        <button class="tb-btn" data-cmd="undo" id="tbUndo" title="실행 취소 (Ctrl+Z)" data-icon="undo"></button>
        <button class="tb-btn" data-cmd="redo" id="tbRedo" title="다시 실행 (Ctrl+Y)" data-icon="redo"></button>
      </div>
      <div class="tb-center">
        <div class="tb-title" id="docTitle" title="클릭하여 이름 바꾸기">통합 문서1 - WIXEL</div>
        <button class="save-state" id="saveState" data-cmd="saveLocations" aria-label="저장 상태 및 저장 위치"></button>
      </div>
      <label class="tb-search">
        <span data-icon="search"></span>
        <input id="searchBox" type="search" placeholder="검색 (Alt+Q)" autocomplete="off">
      </label>
      <div class="avatar" title="WIXEL 위셀">WX</div>
    </header>

    <nav class="ribbon-tabs" id="ribbonTabs"></nav>
    </div>
    <section class="ribbon" id="ribbon"></section>

    <div class="formula-row" id="formulaRow">
      <div class="namebox">
        <input id="nameBox" spellcheck="false" autocomplete="off" aria-label="이름 상자">
        <span class="namebox-caret" data-icon="chevronDown"></span>
      </div>
      <div class="fx-divider">⋮</div>
      <button class="fx-btn" id="fxCancel" title="취소" data-icon="cross" disabled></button>
      <button class="fx-btn" id="fxEnter" title="입력" data-icon="check" disabled></button>
      <button class="fx-btn fx" id="fxInsert" title="함수 삽입" data-icon="fx"></button>
      <div class="formula-input-wrap"><textarea id="formulaInput" rows="1" spellcheck="false" aria-label="수식 입력줄"></textarea></div>
    </div>

    <main class="grid-wrap" id="gridWrap">
      <div class="grid-scroll" id="gridScroll"><div class="grid-sizer" id="gridSizer"></div></div>
      <div class="grid-view" id="gridView">
        <textarea class="cell-editor idle" id="cellEditor" spellcheck="false" autocomplete="off" aria-label="셀 편집"></textarea>
        <ul class="autocomplete" id="autocomplete"></ul>
      </div>
    </main>

    <footer class="footer">
      <div class="sheetbar">
        <button class="sheet-nav" data-cmd="prevSheet" title="이전 시트" data-icon="prev"></button>
        <button class="sheet-nav" data-cmd="nextSheet" title="다음 시트" data-icon="next"></button>
        <div class="sheet-tabs" id="sheetTabs"></div>
        <button class="sheet-add" data-cmd="addSheet" title="새 시트" data-icon="plus"></button>
      </div>
      <div class="statusbar">
        <span id="statusMode">준비</span>
        <button id="calcState" class="calc-state" type="button" aria-label="계산 상태 확인"></button>
        <span class="status-spacer"></span>
        <span id="statusStats"></span>
        <div class="sheet-view-modes" role="group" aria-label="통합 문서 보기">
          <button data-cmd="viewNormal" data-view-mode="normal" title="기본 보기" aria-label="기본 보기" aria-pressed="true" data-icon="table"></button>
          <button data-cmd="viewPageBreakPreview" data-view-mode="pageBreakPreview" title="페이지 나누기 미리 보기" aria-label="페이지 나누기 미리 보기" aria-pressed="false" data-icon="print"></button>
        </div>
        <div class="zoom">
          <button data-cmd="zoomOut" title="축소">−</button>
          <input id="zoomSlider" type="range" min="25" max="400" step="5" value="100" aria-label="확대/축소">
          <button data-cmd="zoomIn" title="확대">+</button>
          <button id="zoomLabel" data-cmd="zoom100" title="100%로 확대/축소">100%</button>
        </div>
      </div>
    </footer>
  </div>

  <div id="menuLayer"></div>
  <div id="dialogLayer"></div>
  <div id="toast" role="status"></div>
  <div id="commentTip" class="comment-tip"></div>
  <div id="printArea"></div>
  <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xlsb,.xls,.xlt,.xltx,.xltm,.ods,.fods,.csv,.tsv,.tab,.prn,.txt,.json,.wixel,.tabula" hidden>
  <script type="module" src="src/app.js"></script>
</body>
</html>
